id: nakshatra-v1
title: The 27 nakshatras
source: >-
  Names, lords, gana, yoni and nadi follow B. V. Raman, "Muhurtha" (Ch. II) and
  "Hindu Predictive Astrology"; the pada naming syllables follow the standard
  108-syllable table as given in Raman and in K. S. Krishnamurti,
  "Fundamental Principles of Astrology". Where a text gives a variant
  transliteration the Devanagari is authoritative.
note: >-
  The lord cycle (Ketu, Venus, Sun, Moon, Mars, Rahu, Jupiter, Saturn, Mercury)
  repeats three times over the 27. Nadi does something different: it zigzags
  over triples -- Adi, Madhya, Antya forward, then Antya, Madhya, Adi backward,
  nine times -- which gives nine of each. Reading it as a repeating period-9
  cycle puts Magha in Adi instead of Antya. The tests assert both structures.

boundaries: equal          # 360/27 = 13°20' each; unequal schemes are separate files

